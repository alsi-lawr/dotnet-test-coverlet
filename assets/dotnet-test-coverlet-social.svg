    <circle cx="1110" cy="585" r="285" fill="#4ade80" opacity="0.035"/>
  </g>
  <path d="M480 408H1136" stroke="#4ade80" stroke-width="4" opacity="0.65"/>
  <g transform="translate(96 160) scale(1.25) translate(-0 -0)" aria-hidden="true">
<defs>
