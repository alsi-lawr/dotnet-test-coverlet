<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">dotnet-test-coverlet</title>
  <desc id="description">The dotnet-test-coverlet coverage mark and wordmark on a dark social card.</desc>
